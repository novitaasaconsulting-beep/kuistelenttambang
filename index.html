<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tambang Career Challenge · talentambang.id</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4EFE4;--fg:#0B0B0B;--card:#FFFFFF;--muted:#4A4A46;--line:#D9D2C2;--gold:#E0A64B;--ink:#0B0B0B;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#101711;--fg:#F4F1EA;--card:#1A241B;--muted:#BFC4BA;--line:#2C382D}}
:root[data-theme="dark"]{--bg:#101711;--fg:#F4F1EA;--card:#1A241B;--muted:#BFC4BA;--line:#2C382D}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Archivo',system-ui,sans-serif;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:24px 20px 40px}
.tag{display:inline-block;background:var(--gold);color:var(--ink);font-weight:700;font-size:13px;letter-spacing:.12em;padding:6px 14px;border-radius:999px}
h1{font-size:clamp(30px,8.4vw,44px);line-height:1.05;font-weight:800;letter-spacing:-.02em;margin:16px 0 12px}
.hl{background:var(--gold);color:var(--ink);border-radius:12px;padding:0 10px 2px;display:inline-block;margin-top:6px}
h2{font-size:clamp(24px,6.5vw,30px);line-height:1.2;font-weight:800;margin:14px 0 18px}
p{margin:0 0 14px;color:var(--muted);font-size:17px}
.btn{display:block;width:100%;min-height:58px;border:0;border-radius:18px;background:var(--gold);color:var(--ink);font:800 19px 'Archivo',sans-serif;cursor:pointer;padding:14px 20px}
.btn.alt{background:transparent;color:var(--fg);border:2px solid var(--fg)}
.opt{display:block;width:100%;text-align:left;min-height:62px;margin:0 0 12px;padding:14px 18px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--fg);font:600 17px/1.35 'Archivo',sans-serif;cursor:pointer}
.opt:hover,.opt:focus-visible{border-color:var(--gold)}
.bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin:14px 0 6px}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:999px;transition:width .3s}
.small{font-size:14px;color:var(--muted)}
.note{border:2px dashed var(--line);border-radius:16px;padding:12px 16px;font-size:14px;color:var(--muted);margin-top:18px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px;margin:16px 0}
.row{display:flex;align-items:center;gap:10px;margin:8px 0;font-weight:700;font-size:15px}
.row span.n{width:96px;flex:none}
.row .t{flex:1;height:12px;background:var(--line);border-radius:999px;overflow:hidden}
.row .t i{display:block;height:100%;background:var(--gold)}
.qr{display:flex;gap:16px;align-items:center}
.qr img{width:130px;height:130px;border-radius:12px;background:#fff;padding:6px;flex:none}
ul{margin:0 0 14px;padding-left:20px;color:var(--muted);font-size:16px}
</style>
</head>
<body>
<main id="app"></main>

function shuffle(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t}return a}
function intro(){clearTimeout(timer);i=0;score={O:0,P:0,H:0,E:0,X:0};
app.innerHTML='<span class="tag">MINERBA CONVEX 2026</span><h1>TAMBANG CAREER <span class="hl">CHALLENGE</span></h1><p>7 pertanyaan singkat (sekitar 2 menit) untuk melihat bidang tambang mana yang paling dekat dengan minatmu.</p><button class="btn" onclick="ask()">Mulai kuis</button><div class="note"><b>Catatan:</b> ini kuis ringan untuk refleksi minat dan bersenang-senang di booth. Ini bukan asesmen profesional dan belum divalidasi secara ilmiah, jadi hasilnya tidak menentukan bakat atau kelayakan kerja. Kami tidak menyimpan jawabanmu.</div>'}
function ask(){var q=Q[i];var opts=shuffle(q[1]);
var h='<span class="small">Pertanyaan '+(i+1)+' dari '+Q.length+'</span><div class="bar"><i style="width:'+(i/Q.length*100)+'%"></i></div><h2>'+q[0]+'</h2>';
opts.forEach(function(o){h+='<button class="opt" onclick="pick(\''+o[0]+'\')">'+o[1]+'</button>'});
app.innerHTML=h;window.scrollTo(0,0)}
function pick(k){score[k]++;i++;if(i<Q.length)ask();else result()}
function result(){
var keys=Object.keys(score).sort(function(a,b){return score[b]-score[a]});
var top=ORB[keys[0]],sec=score[keys[1]]>0?ORB[keys[1]]:null;
var h='<span class="tag">HASIL KUISMU</span><h1>'+top.n+'</h1><h2 style="margin-top:0">'+top.tag+'</h2><p>'+top.d+'</p>';
if(sec)h+='<p>Orbit kedua yang dekat denganmu: <b style="color:var(--fg)">'+sec.n+'</b>.</p>';
h+='<div class="card"><b>Contoh bidang yang bisa kamu jelajahi:</b><p style="margin:6px 0 0">'+top.bid+'</p></div>';
h+='<div class="card"><b>Kecenderungan jawabanmu</b>';
keys.forEach(function(k){h+='<div class="row"><span class="n">'+ORB[k].n+'</span><div class="t"><i style="width:'+(score[k]/Q.length*100)+'%"></i></div></div>'});
h+='</div>';
h+='<div class="card qr"><img src="'+QR+'" alt="Kode QR talentambang.id"><div><b>Lanjutkan di talentambang.id</b><p style="margin:4px 0 0;font-size:15px">Scan untuk menjelajahi talentambang AI, Peta Karier, dan modul belajar.</p></div></div>';
h+='<button class="btn" onclick="intro()">Ulangi kuis</button><div class="note">Kuis ini hanya gambaran minat awal, bukan asesmen profesional, dan belum divalidasi. Untuk uji atau sertifikasi kompetensi, rujuk lembaga resmi seperti BNSP.</div>';
app.innerHTML=h;window.scrollTo(0,0);
clearTimeout(timer);timer=setTimeout(intro,150000)}
intro();
</script>
